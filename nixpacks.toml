[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
# npm ci installs exactly what package-lock.json pins - reproducible builds
# instead of pulling whatever the semver ranges resolve to at deploy time.
cmds = ["npm ci --omit=dev"]

[phases.build]
cmds = []

[start]
cmd = "npm start"

# NOTE: nixpacks has no [health-check] section - the deploy healthcheck is
# configured in railway.json (deploy.healthcheckPath).
