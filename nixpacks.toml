[phases.setup]
# Node 20 ist seit 2026-04-30 End-of-Life und bekommt keine Sicherheits-
# patches mehr. 22 ist Maintenance LTS bis 2027-04-30. Die Zahl hier ist
# die verbindliche - package.json/engines und .node-version muessen dazu
# passen, sonst waehlt Railway etwas anderes als gedacht.
nixPkgs = ["nodejs_22"]

[phases.install]
# npm ci installs exactly what package-lock.json pins - reproducible builds
# instead of pulling whatever the semver ranges resolve to at deploy time.
cmds = ["npm ci --omit=dev"]

[phases.build]
cmds = []

[start]
cmd = "npm start"

# NOTE: nixpacks has no [health-check] section - the deploy healthcheck is
# configured in railway.json (deploy.healthcheckPath).
